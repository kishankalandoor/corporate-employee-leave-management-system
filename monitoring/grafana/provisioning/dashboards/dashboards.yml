apiVersion: 1

providers:
  - name: 'LMS Provisioned Dashboards'
    orgId: 1
    folder: 'Leave Management System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
