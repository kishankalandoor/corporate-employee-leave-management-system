groups:
  - name: lms_alerts
    rules:
      - alert: BackendServiceDown
        expr: up{job="lms-backend"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "LMS Backend API service is down"
          description: "Backend has been unreachable for more than 30 seconds."

      - alert: HighHttpErrorRate
        expr: rate(http_requests_total{status=~"5.."}[1m]) / rate(http_requests_total[1m]) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate detected"
          description: "More than 5% of requests returned 5xx status codes over the last minute."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 1.0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency detected"
          description: "95th percentile request latency exceeds 1.0 second."
